[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "okami-memorias"
version = "0.1.0"
description = "Motor offline de mosaicos fotográficos escolares"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "reportlab>=4.2,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pypdf>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
